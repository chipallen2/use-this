name: weekly-recompute

on:
  schedule:
    # Mondays 12:00 UTC = 5am PDT / 4am PST
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Scrape + render
        env:
          RECALC_URL: ${{ secrets.RECALC_URL }}
        run: |
          npm run scrape
          export CALC_ISO_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npm run render
      - name: Commit if changed
        run: |
          git config user.name "chipallen2"
          git config user.email "4950543+chipallen2@users.noreply.github.com"
          git pull --rebase origin main || git pull origin main
          git add dist/index.html dist/llms.txt dist/og-image.png dist/favicon.ico dist/favicon-32.png dist/favicon-64.png dist/apple-touch-icon.png
          git diff --cached --quiet || git commit -m " Weekly picks $(date +%F)"
          git push
